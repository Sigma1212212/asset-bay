name = "asset-bay"
main = "src/index.js"
compatibility_date = "2026-09-01"

# The Worker gets its own subdomain; Cloudflare creates the DNS record for it automatically.
# URLs look like https://assetbay.randomthingsthatarecool.dev/asset-bay/feed
routes = [
  { pattern = "assetbay.randomthingsthatarecool.dev", custom_domain = true }
]

# Presence rooms (menus seeing each other). SQLite-backed class so it runs on the Workers Free plan.
[[durable_objects.bindings]]
name = "PRESENCE"
class_name = "PresenceRoom"

# Spending guard counter (see src/budget.js). One instance, keyed "global".
[[durable_objects.bindings]]
name = "BUDGET"
class_name = "Budget"

# Settings sync (see src/settings.js). One instance per sync-code hash.
[[durable_objects.bindings]]
name = "SETTINGS"
class_name = "SettingsStore"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PresenceRoom"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Budget"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["SettingsStore"]

# Videos, bundles and the signed feed live in this R2 bucket.
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "asset-bay-media"
